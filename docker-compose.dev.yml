# Local development overrides. Never used on the VM.
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#   (or: scripts/dev-up.sh, which runs exactly that and prints the local URLs)
#
# Adds a mock model (so no GPU is needed), publishes ports on localhost,
# swaps Caddy to plain HTTP on http://localhost:8088 and runs the portal in
# development mode. The portal image is the real one: there is no bind mount
# of the source, so rebuild (--build) to see code changes.

services:
  mock-vllm:
    build: ./dev/mock_vllm
    restart: unless-stopped
    environment:
      MOCK_API_KEY: ${VLLM_API_KEY}
    ports:
      - "127.0.0.1:8001:8000"

  litellm:
    depends_on:
      mock-vllm:
        condition: service_started

  postgres:
    ports:
      - "127.0.0.1:55432:5432"

  caddy:
    ports: !override
      - "127.0.0.1:8088:8088"
    volumes: !override
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data

  portal:
    # Straight to the container, for debugging. Use http://localhost:8088 to
    # sign in: the portal checks that requests come from PORTAL_PUBLIC_URL.
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORTAL_ENV: development
      PORTAL_PUBLIC_URL: http://localhost:8088
      PORTAL_COOKIE_SECURE: "false"
      PORTAL_INVITE_CODE: local-invite
